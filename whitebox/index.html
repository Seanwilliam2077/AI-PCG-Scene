<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>单图白盒 · AI-PCG-Scene</title>
  <meta name="description" content="输入一张图，浏览器内重建可环绕查看的几何白盒（深度推理 + 几何求解全部本地运行）" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧊</text></svg>" />
  <script type="module" crossorigin src="./assets/index-cemDUGgd.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-DK-5HXul.css">
</head>
<body>
  <canvas id="viewport"></canvas>

  <div id="hud">
    <div class="brand">🧊 <b>whitebox</b><span>单图 → 几何白盒</span></div>
    <label class="btn" for="file-input">选择图片</label>
    <input type="file" id="file-input" accept="image/*" hidden />
    <button class="btn ghost" id="demo-btn">示例图</button>
    <div id="status">拖入或选择一张图片开始</div>
    <img id="thumb" alt="" hidden />
  </div>

  <div id="controls" hidden>
    <span class="seg">
      <button class="btn small active" id="mode-match">对位视角</button>
      <button class="btn small" id="mode-orbit">自由环绕</button>
    </span>
    <label id="overlay-row">叠加 <input type="range" id="overlay" min="0" max="100" step="1" value="50" /><b id="overlay-v">50%</b></label>
    <label>细度 <input type="range" id="grain" min="0.4" max="2.4" step="0.1" value="1.2" /><b id="grain-v">1.2</b></label>
    <span id="cam-info" title="消失点/评分自动解算，无手动变换">相机：—</span>
    <button class="btn ghost" id="export-glb">导出 GLB</button>
  </div>

  <img id="overlay-img" alt="" />
  <div id="drop-overlay"><span>松开以载入图片</span></div>

</body>
</html>
